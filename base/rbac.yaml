apiVersion: v1
kind: ServiceAccount
metadata:
  name: status-page
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: status-page-reader
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, namespaces]
    verbs: [get, list]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [get, list]
  - apiGroups: ["argoproj.io"]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: status-page-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: status-page-reader
subjects:
  - kind: ServiceAccount
    name: status-page
    namespace: apps