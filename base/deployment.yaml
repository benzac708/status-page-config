apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status-page
  template:
    metadata:
      labels:
        app: status-page
    spec:
      serviceAccountName: status-page
      containers:
        - name: status-page
          image: ghcr.io/benzac708/status-page:91bd49288dc8279dc80b6576aec5265f4e889e80
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5